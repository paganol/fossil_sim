# FOSSIL baseline configuration.
# Every value carries its source; "TBD — placeholder" means not yet fixed.

[simulation]
master_seed = 20260101                    # arbitrary
mission_start = "2040-01-01T00:00:00"     # TBD — placeholder (TDB): start of science
                                          # operations at L2, not launch
duration_days = 1278.375                  # 3.5 yr nominal mission, Step2

[timeline]
# The Cooler-cycle duration is derived:
# (scans_per_ring * rings_per_cycle + recycling_scans) * ifgs_per_scan * ifg_duration_s
ifg_duration_s = 2.0                      # Step2 §5.4.2 ("one IFG every ~2 s")
ifgs_per_scan = 720                       # Step2 §5.4.2 (1440 s per scan); NOTE: implies
                                          # spin period 24 min = 2.5 rph, text says "about 2 rph"
scans_per_ring = 23                       # Step2 §5.4.2 (~9.2 h per ring)
rings_per_cycle = 3                       # Step2 §5.4.2 (~28 h per 35 h cycle)
recycling_scans = 18                      # TBD — 7.2 h ≈ "~7 h" R window, rounded to whole Scans
                                          # so every Ring starts at spin phase 0

[scanning]
spin_boresight_angle_deg = 90.0           # TBD — default great circles
ring_stepping = "equal_per_cycle"         # see CONTEXT.md "Ring stepping"; alternatives:
                                          # "anchor_ring_start", "fixed"
fixed_ring_step_deg = 0.5                 # Step2 §5.4.2; used only by ring_stepping = "fixed"
precession_amplitude_deg = 0.0            # TBD — "a few degrees", Step2 §5.4.2
precession_period_days = 0.0              # TBD
precession_phase_deg = 0.0                # TBD
max_saa_deg = 10.0                        # Step2 §5.4.2 (max Solar Aspect Angle ~10 deg)

[orbit]
# L2 approximated as Earth position/velocity scaled along the Sun-Earth line,
# plus a Lissajous orbit. Default values: WMAP orbit, Cavaluzzi, Fink & Coyle (2008).
earth_l2_distance_km = 1496509.30522      # litebird_sim (constants.EARTH_L2_DISTANCE_KM)
lissajous_radius1_km = 244450.0           # TBD — placeholder (WMAP)
lissajous_radius2_km = 137388.0           # TBD — placeholder (WMAP)
lissajous_freq1_cycles_yr = 2.02104       # TBD — placeholder (WMAP)
lissajous_freq2_cycles_yr = 1.98507       # TBD — placeholder (WMAP)
lissajous_phase_deg = -47.944             # TBD — placeholder (WMAP)

[operations]
mode_switch_interval_s = 16560.0          # TBD — length of each Mode block, observing time only
                                          # (clock stopped in Recycling); multiple of
                                          # ifg_duration_s. 1440 = every Scan, 33120 / n = Ring
                                          # in n parts. 16560 = half Ring: switch at spin phase π
                                          # (south ecliptic pole), every Ring seen in both Modes
mode_pattern = ["B10", "B01", "B01", "B10"]  # TBD — Mode of successive blocks, repeated; with
                                          # half Rings: no switch between Rings (3 per cycle)
mode_switch_dead_time_s = 300.0           # TBD — placeholder: data discarded after each switch
                                          # within an observing period (0 = instantaneous);
                                          # rounded up to whole IFGs
recycling_data = "flagged"                # "flagged" | "off"
recycling_mode = "B00"                    # TBD — placeholder

[bbir]
setpoints_k = [2.725]                     # TBD — placeholder within 2.5–2.9 K (Step2);
                                          # setpoint of cycle i = setpoints_k[i % len]
port_offsets_k = [0.0, 0.0]               # TBD — BBIR seen by Port 1/2, equal in v0.1
hf_cavity_k = 0.0                         # TBD — 0 = HF cavity off

[maps]
nsides = [64, 128]

[instrument]
freq_min_ghz = 30.0                       # TBD — np.arange(30, 2000, 15): M8 band edge and
freq_max_ghz = 2000.0                     # 15 GHz resolution; final grid with the FTS team
freq_step_ghz = 15.0
band_min_ghz = 30.0                       # M8 proposal §2.1 (FTS band 30–2000 GHz);
                                          # Step2 had 50 GHz
band_max_ghz = 2000.0                     # M8 proposal §2.1
dichroic_split_ghz = 200.0                # M8 proposal §2.1 (LF/HF split at each output);
                                          # Step2 had 300 GHz
beam_fwhm_deg = 1.6                       # Step2
band_edge_fraction = 0.0                  # TBD — top-hat bands; > 0: cosine edges of width
                                          # fraction × edge frequency at band_min,
                                          # dichroic_split and band_max (e.g. 0.1, placeholder
                                          # until the filter specifications); IFG domain only
                                          # (docs: Interferogram)

[sky]
# Isotropic backgrounds (CONTEXT.md), evaluated per IFG with the exact Boost
# (ADR 0002). An amplitude of 0 switches a component off.
t_cmb_k = 2.72548                         # Fixsen 2009, ApJ 707, 916
include_cmb_blackbody = true
y = 1.77e-6                               # ΛCDM fiducial, Hill et al. 2015, PRL 115, 261301
y_electron_temperature_kev = 1.24         # Hill et al. 2015; Abitbol et al. 2017 (rSZ)
mu = 2.0e-8                               # ΛCDM fiducial, Chluba 2016, MNRAS 460, 227
cib_amplitude = 1.3e-5                    # Fixsen et al. 1998, ApJ 508, 123
cib_spectral_index = 0.64                 # Fixsen et al. 1998
cib_temperature_k = 18.5                  # Fixsen et al. 1998
cib_reference_freq_ghz = 3000.0           # Fixsen et al. 1998 (ν₀ = 100 cm⁻¹)
co_amplitude = 1.0                        # template of Abitbol et al. 2017
solar_velocity_km_s = 369.816             # Planck 2018 I (arXiv:1807.06205)
solar_velocity_gal_lat_deg = 48.253       # Planck 2018 I
solar_velocity_gal_lon_deg = 264.021      # Planck 2018 I
include_orbital_velocity = true
apply_beam_to_dipole = true               # dipole term × b₁ = exp(−σ²) of the Gaussian beam

[static_sky]
# Static sky (CONTEXT.md): pysm3 anisotropies in the barycentric frame
# (Galactic) or CMB frame (c*, extragalactic) (ADR 0003), beam-smoothed alm in
# J2000 ecliptic, cached on disk.
# Models dip*/co* are forbidden; cosmological ones (c*, cib*, tsz*, ksz*, rg*)
# have their monopole removed (ADR 0002). An empty list disables it.
models = ["c1", "d2", "s1", "a1", "f1"]   # bisou_sky defaults
nside = 128                               # maps; pysm3 evaluated at 2 × nside
lmax = 383                                # 3 × nside − 1; beam b_ℓ(383) ≈ 3e-5
doppler = true                            # first-order Doppler (ADR 0003): orbital velocity for
                                          # Galactic models, solar + orbital for CMB anisotropies
                                          # and extragalactic models; slope dI/dlnν from pysm3
cache_dir = "cache/static_sky"            # relative to the working directory
sampling = "alm"                          # "alm" (ducc0, exact) | "nearest" (pixel)
nthreads = 0                              # synthesis threads, 0 = all cores (performance only;
                                          # lower it when several MPI ranks share a node)
rank_epsilon = 1e-9                       # sampling "alm": low-rank factorization in frequency,
                                          # every frequency map within rank_epsilon of its rms
                                          # (1e-9 = synthesis accuracy); 0 = off, one synthesis
                                          # per frequency and IFGs on the full spectra (slower)

[zodi]
# Zodiacal light (zodipy), seen from the spacecraft position of [orbit].
# Evaluated on the 720 directions of each Ring at its start and end, linearly
# interpolated in time (the Scans of a Ring retrace the same circle).
enabled = true
model = "planck18"                        # Planck Collaboration 2018 (calibrated 100–857 GHz);
                                          # prompt: prefer planck18 below ~1 THz
extrapolate = true                        # needed outside 100–857 GHz (~20 % uncertainty above)
gauss_quad_degree = 50                    # zodipy default (points per line of sight)
nprocesses = 1                            # zodipy parallelism (performance only)

[noise]
# Photon noise of each DU from its optical loading (Coulon, Aghanim & Maffei 2026,
# arXiv:2609.17829, Eq. 15–16; docs: Noise):
# P_ν = m α AΩ w(ν) [f_opt (I_sky + I_BBIR) + Σ ε_k B_ν(T_k)],
# NEP² = ∫ [2 h ν P_ν + 2 P_ν² c² / (ν² AΩ)] dν over the DU band; then
# δS_ν = NEP / (√t_IFG · AΩ · Δν · α · f_opt · m) per IFG, bin and DU, derived (and
# tested by Monte Carlo) from white noise NEP / √(2 δt) on the IFG samples and a
# least-squares fit of the cosine amplitudes; the √(2t) of PIXIE (Kogut et al. 2011;
# arXiv:2405.20403v2, eq. 4–6) refers to the complex Fourier coefficient, a/2 for a
# cosine of amplitude a, so it is √2 lower.
enabled = true
nep_model = "photon"                      # "fixed": nep_lf/hf_w_sqrt_hz below
nep_lf_w_sqrt_hz = 4.6e-16                # used only with nep_model = "fixed"
                                          # (Step2 Table 4.1, NEP_photon mean LF band)
nep_hf_w_sqrt_hz = 3.8e-16                # used only with nep_model = "fixed"
                                          # (Step2 Table 4.1; the M8 Table 2.3 value
                                          # 1.3e-14 is not a photon NEP, docs: Noise)
etendue_cm2_sr = 3.0                      # arXiv:2609.17618 §4.3 (AΩ = nλ² ≈ 3 cm² sr,
                                          # LF and HF DUs)
absorptivity = 0.5                        # Coulon et al. Table 2 (detector efficiency η)
optical_efficiency = 1.0                  # TBD — Coulon et al. Table 2 explores T_k in
                                          # [0.8, 0.999]
modulation_efficiency = 0.5               # Coulon et al. Eq. 11–12: Martin-Puplett, DU
                                          # absorbing both polarisations,
                                          # P = ½[(I1 + I2) ± (I1 − I2) cos]
optics_emissivity = [0.01]                # Coulon et al. Table 2 reference (1 %, 4.5 K):
optics_temperature_k = [4.5]              # one grey body; the optics has ~20 elements (TBD)
recycling_noise_factor = 3.0              # TBD — placeholder: noise × 3 in the Recycling window
# 1/f detector noise on the IFG samples (ifg.simulate only; docs: Noise),
# PSD σ² [(f² + f_knee²) / (f² + f_min²)]^(α/2) with σ the white level above;
# a bin at ν sits at the electrical frequency ν v_OPD / c (1 Hz at 30 GHz here)
fknee_lf_mhz = 0.0                        # TBD — 0: white noise
fknee_hf_mhz = 0.0                        # TBD — 0: white noise
one_over_f_alpha = 1.0                    # TBD
one_over_f_fmin_hz = 1e-5                 # TBD — placeholder (as litebird_sim)

[response]
# True response of each DU, d = g (s (I1 − I2) + o) + n (docs: Instrument and
# signal); DU order LF-L, HF-L, LF-R, HF-R. Defaults: ideal instrument.
gain = [1.0, 1.0, 1.0, 1.0]               # TBD — gain relative to the nominal response
gain_rms = 0.0                            # TBD — rms of the per-bin fluctuation of g,
                                          # g = gain × (1 + gain_rms × N(0, 1)), fixed per seed
offset_emissivity = [0.0, 0.0, 0.0, 0.0]  # TBD — signed emissivity imbalance ε between the
                                          # arms: offset o = ε B_ν(instrument_temperature_k)
instrument_temperature_k = 2.725          # TBD — placeholder instrument temperature
# Gain drift g → g (1 + γ(t)), one γ per IFG and DU, independent DUs (docs:
# Instrument and signal), PSD σ² [(f² + f_knee²) / (f² + f_min²)]^(α/2) at 1 / t_IFG
gain_drift_sigma = 0.0                    # TBD — white rms of γ per IFG; 0: no drift
gain_drift_fknee_mhz = 0.0                # TBD — 0: white
gain_drift_alpha = 1.0                    # TBD
gain_drift_fmin_hz = 1e-5                 # TBD — placeholder (as litebird_sim)

[calibration]
solution = "nominal"                      # calibration used for the sky estimate:
                                          # "nominal" (g = 1, o = 0) | "true" (oracle)

[output]
save_tod = false                          # one HDF5 file per Cooler cycle when true

[ifg]
# Ideal-FTS interferogram, modulation cos(2π ν x / c)
# with x the optical path difference (OPD): spectral resolution c / (2 x_max),
# Nyquist sampling of ν_max needs an OPD step <= c / (2 ν_max) (checked with simulate).
max_opd_m = 0.01                          # TBD — placeholder: c / (2 × 15 GHz), matches freq_step_ghz
samples_per_ifg = 512                     # TBD — placeholder: symmetric scan −x_max..+x_max,
                                          # step 39 µm < c / (2 × 2000 GHz) = 75 µm
opd_per_mirror_position = 2.0             # TBD — OPD / mirror displacement; 2 from the Step2
                                          # formula cos(4π ν δ / c); 4 if both rooftops move (PIXIE-like)
simulate = false                          # false: spectral domain (sky + Gaussian noise per bin);
                                          # true: IFG samples + white noise, spectrum by least
                                          # squares (docs: Interferogram)
sky_variation = true                      # with simulate: Static sky follows the boresight
                                          # during the IFG (false: sky at the IFG centre)
# Generation grid (both or neither; default: the instrument grid, IFGs exact on the fit
# basis). IFGs generated on k × step up to max (where some DU transmits) and fitted on the
# instrument bins: bin averaging, leakage and out-of-band signal (docs: Interferogram).
# Max below Nyquist, c / (2 OPD step) = 3830 GHz at baseline. Example:
# generation_freq_step_ghz = 3.0
# generation_freq_max_ghz = 3825.0
apodization = "none"                      # IFG domain: apodization of the samples before the fit,
                                          # "none" | "norton_beer_weak" | "norton_beer_medium" |
                                          # "norton_beer_strong" | "hann" | "triangular" |
                                          # "kaiser" (docs: Interferogram)
kaiser_beta = 6.0                         # β of apodization = "kaiser": 0 = none, larger =
                                          # wider line shape, lower sidelobes
