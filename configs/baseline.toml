# FOSSIL baseline configuration.
# Every value carries its source; "TBD — placeholder" means not yet fixed.

[simulation]
master_seed = 20260101                    # arbitrary
mission_start = "2040-01-01T00:00:00"     # TBD — placeholder (TDB): start of science
                                          # operations at L2, not launch
duration_days = 1278.375                  # 3.5 yr nominal mission, Step2

[timeline]
# The Cooler-cycle duration is derived:
# (scans_per_ring * rings_per_cycle + recycling_scans) * ifgs_per_scan * ifg_duration_s
ifg_duration_s = 2.0                      # Step2 §5.4.2 ("one IFG every ~2 s")
ifgs_per_scan = 720                       # Step2 §5.4.2 (1440 s per scan); NOTE: implies
                                          # spin period 24 min = 2.5 rph, text says "about 2 rph"
scans_per_ring = 23                       # Step2 §5.4.2 (~9.2 h per ring)
rings_per_cycle = 3                       # Step2 §5.4.2 (~28 h per 35 h cycle)
recycling_scans = 18                      # TBD — 7.2 h ≈ "~7 h" R window, rounded to whole Scans
                                          # so every Ring starts at spin phase 0

[scanning]
spin_boresight_angle_deg = 90.0           # TBD — default great circles
ring_stepping = "equal_per_cycle"         # see CONTEXT.md "Ring stepping"; alternatives:
                                          # "anchor_ring_start", "fixed"
fixed_ring_step_deg = 0.5                 # Step2 §5.4.2; used only by ring_stepping = "fixed"
precession_amplitude_deg = 0.0            # TBD — "a few degrees", Step2 §5.4.2
precession_period_days = 0.0              # TBD
precession_phase_deg = 0.0                # TBD
max_saa_deg = 10.0                        # Step2 §5.4.2 (max Solar Aspect Angle ~10 deg)

[orbit]
# L2 approximated as Earth position/velocity scaled along the Sun-Earth line,
# plus a Lissajous orbit. Default values: WMAP orbit, Cavaluzzi, Fink & Coyle (2008).
earth_l2_distance_km = 1496509.30522      # litebird_sim (constants.EARTH_L2_DISTANCE_KM)
lissajous_radius1_km = 244450.0           # TBD — placeholder (WMAP)
lissajous_radius2_km = 137388.0           # TBD — placeholder (WMAP)
lissajous_freq1_cycles_yr = 2.02104       # TBD — placeholder (WMAP)
lissajous_freq2_cycles_yr = 1.98507       # TBD — placeholder (WMAP)
lissajous_phase_deg = -47.944             # TBD — placeholder (WMAP)

[operations]
ring_mode_pattern = ["B10", "B01"]        # prompt default: alternate B10/B01 Scan by Scan;
                                          # repeated over the global Scan index
mode_switch_dead_ifgs = 1                 # TBD — placeholder
recycling_data = "flagged"                # "flagged" | "off"
recycling_mode = "B00"                    # TBD — placeholder

[bbir]
setpoints_k = [2.725]                     # TBD — placeholder within 2.5–2.9 K (Step2);
                                          # setpoint of cycle i = setpoints_k[i % len]
port_offsets_k = [0.0, 0.0]               # TBD — BBIR seen by Port 1/2, equal in v0.1
hf_cavity_k = 0.0                         # TBD — 0 = HF cavity off

[maps]
nsides = [64, 128]

[instrument]
freq_min_ghz = 30.0                       # TBD — np.arange(30, 2000, 15): M8 band edge and
freq_max_ghz = 2000.0                     # 15 GHz resolution; final grid with the FTS team
freq_step_ghz = 15.0
band_min_ghz = 30.0                       # M8 proposal §2.1 (FTS band 30–2000 GHz);
                                          # Step2 had 50 GHz
band_max_ghz = 2000.0                     # M8 proposal §2.1
dichroic_split_ghz = 200.0                # M8 proposal §2.1 (LF/HF split at each output);
                                          # Step2 had 300 GHz
beam_fwhm_deg = 1.6                       # Step2

[sky]
# Isotropic backgrounds (CONTEXT.md), evaluated per IFG with the exact Boost
# (ADR 0002). An amplitude of 0 switches a component off.
t_cmb_k = 2.72548                         # Fixsen 2009, ApJ 707, 916
include_cmb_blackbody = true
y = 1.77e-6                               # ΛCDM fiducial, Hill et al. 2015, PRL 115, 261301
y_electron_temperature_kev = 1.24         # Hill et al. 2015; Abitbol et al. 2017 (rSZ)
mu = 2.0e-8                               # ΛCDM fiducial, Chluba 2016, MNRAS 460, 227
cib_amplitude = 1.3e-5                    # Fixsen et al. 1998, ApJ 508, 123
cib_spectral_index = 0.64                 # Fixsen et al. 1998
cib_temperature_k = 18.5                  # Fixsen et al. 1998
cib_reference_freq_ghz = 3000.0           # Fixsen et al. 1998 (ν₀ = 100 cm⁻¹)
co_amplitude = 1.0                        # template of Abitbol et al. 2017
solar_velocity_km_s = 369.816             # Planck 2018 I (arXiv:1807.06205)
solar_velocity_gal_lat_deg = 48.253       # Planck 2018 I
solar_velocity_gal_lon_deg = 264.021      # Planck 2018 I
include_orbital_velocity = true
apply_beam_to_dipole = true               # dipole term × b₁ = exp(−σ²) of the Gaussian beam

[static_sky]
# Static sky (CONTEXT.md): pysm3 anisotropies in the barycentric frame
# (ADR 0003), beam-smoothed alm in J2000 ecliptic, cached on disk.
# Models dip*/co* are forbidden; extragalactic ones (cib*, tsz*, ksz*, rg*)
# have their monopole removed (ADR 0002). An empty list disables it.
models = ["c1", "d2", "s1", "a1", "f1"]   # bisou_sky defaults
nside = 128                               # maps; pysm3 evaluated at 2 × nside
lmax = 383                                # 3 × nside − 1; beam b_ℓ(383) ≈ 3e-5
orbital_doppler = true                    # first-order Doppler from the orbital velocity
cache_dir = "cache/static_sky"            # relative to the working directory
sampling = "alm"                          # "alm" (ducc0, exact) | "nearest" (pixel)

[zodi]
# Zodiacal light (zodipy), seen from the spacecraft position of [orbit].
# Evaluated on the 720 directions of each Ring at its start and end, linearly
# interpolated in time (the Scans of a Ring retrace the same circle).
enabled = true
model = "planck18"                        # Planck Collaboration 2018 (calibrated 100–857 GHz);
                                          # prompt: prefer planck18 below ~1 THz
extrapolate = true                        # needed outside 100–857 GHz (~20 % uncertainty above)
gauss_quad_degree = 50                    # zodipy default (points per line of sight)
nprocesses = 1                            # zodipy parallelism (performance only)

[noise]
# Spectral-domain white noise per IFG, bin and DU (PIXIE, Kogut et al. 2011, §2):
# δS_ν = NEP / (√(2 t_IFG) · AΩ · Δν · α · f_opt), Δν = instrument.freq_step_ghz.
enabled = true
nep_lf_w_sqrt_hz = 4.8e-16                # M8 proposal Table 2.3 (NEP_total, 30–200 GHz).
nep_hf_w_sqrt_hz = 1.3e-14                # M8 proposal Table 2.3 (NEP_total, 200–2000 GHz).
                                          # TBD — read as NEP per FPU (= per DU, 4 pixels
                                          # combined); if per pixel, divide by √4
etendue_cm2_sr = 4.0                      # TBD — placeholder PIXIE (Kogut et al. 2011)
absorptivity = 0.57                       # TBD — placeholder PIXIE
optical_efficiency = 0.90                 # TBD — placeholder PIXIE
recycling_noise_factor = 3.0              # TBD — placeholder: noise × 3 in the Recycling window

[output]
save_tod = false                          # one HDF5 file per Cooler cycle when true

[ifg]
# Ideal-FTS interferogram (illustration only in v0.1), modulation cos(2π ν x / c)
# with x the optical path difference (OPD): spectral resolution c / (2 x_max),
# Nyquist sampling of ν_max needs an OPD step <= c / (2 ν_max).
max_opd_m = 0.01                          # TBD — placeholder: c / (2 × 15 GHz), matches freq_step_ghz
samples_per_ifg = 512                     # TBD — placeholder: symmetric scan −x_max..+x_max,
                                          # step 39 µm < c / (2 × 2000 GHz) = 75 µm
opd_per_mirror_position = 2.0             # TBD — OPD / mirror displacement; 2 from the Step2
                                          # formula cos(4π ν δ / c); 4 if both rooftops move (PIXIE-like)
