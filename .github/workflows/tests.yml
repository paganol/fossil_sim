name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - uses: actions/cache@v4
        with:
          # pysm3 templates (astropy download cache) and the Static-sky cube
          path: |
            ~/.astropy/cache
            notebooks/cache
          key: static-sky-${{ hashFiles('configs/baseline.toml', 'uv.lock') }}
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -m "not heavy"
      - run: uv run pytest --nbmake notebooks

  oracle:
    # Optional cross-checks against litebird_sim (pointing) and bisou_sky (spectra)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - uses: actions/cache@v4
        with:
          path: ~/.astropy/cache
          key: pysm3-data-${{ hashFiles('uv.lock') }}
      - run: uv run --with litebird_sim --with "git+https://github.com/paganol/BISOU-sky" pytest -m heavy

  mpi:
    # MPI run must equal the serial run (ADR 0001)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - run: uv sync --extra mpi
      - run: uv run mpirun --oversubscribe -n 3 python scripts/mpi_check.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra docs
      - run: uv run sphinx-build -W docs docs/_build/html
