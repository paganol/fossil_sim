name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -m "not heavy"
      - run: uv run pytest --nbmake notebooks

  oracle:
    # Optional cross-check of the pointing against litebird_sim
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run --with litebird_sim pytest -m heavy

  mpi:
    # MPI run must equal the serial run (ADR 0001)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin
      - run: uv sync --extra mpi
      - run: uv run mpirun --oversubscribe -n 3 python scripts/mpi_check.py
